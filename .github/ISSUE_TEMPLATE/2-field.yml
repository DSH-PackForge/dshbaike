name: 内容变更 · 改一个字段
description: 补或改词条头部的一个字段（更新日期、标签、别名、安装命令…）——机器人只改那一行并开 PR
title: "[改一个字段] "
labels: ["内容变更"]
body:
  - type: markdown
    attributes:
      value: |
        适合改**词条头部（front-matter）里的一个字段**：`updatedAt`、`summary`、`titleEn`、
        `aliases`、`tags`、`install`、`repo`、`npm`、`platforms` 这类**单值或列表**字段。
        
        **嵌套结构改不了**（`compat`、`relations`、`composition` 这种多层的）——那些请直接编辑文件。
        机器人会明确告诉你它改不了，而不是改错。
        
        **「GitHub 用户名」是必填的**——署名要用它（提交作者会写成这个名字），机器人会核实账号存在；填错直接拒绝。

  - type: input
    id: entry
    attributes:
      label: 词条 id
      description: 形如 plugin/1 或 concept/2。从词条页点进来时标题里已带编号，可留空。
      placeholder: plugin/1
    validations:
      required: false
  - type: input
    id: username
    attributes:
      label: GitHub 用户名
      description: 必填——署名要用它：这条改动的提交作者会写成这个名字。只填用户名本身（不是显示名、不是邮箱、不要 @）；机器人会核实账号存在，填错直接拒绝。
      placeholder: your-github-name
    validations:
      required: true
  - type: input
    id: field
    attributes:
      label: 字段名
      description: 只写字段名本身，小写字母（如 updatedAt、tags、install）。
      placeholder: updatedAt
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: 新的值
      description: 列表字段（tags / aliases / platforms…）用逗号分隔，例如「兼容性, 前置」。要清空就写 null。
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 出处（可选但强烈建议）
      description: 你凭什么这么改？规范路径 / 代码位置 / 上游链接——有出处我们才敢合。
    validations:
      required: false
