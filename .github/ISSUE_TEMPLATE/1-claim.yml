name: 内容变更 · 担任维护者
description: 担任一条词条的维护者：你愿意跟进它（上游变了、内容过时了能被 @ 到）——机器人只加一个用户名并开 PR
title: "[担任维护者] "
labels: ["内容变更"]
body:
  - type: markdown
    attributes:
      value: |
        担任之后你的用户名会出现在这条词条的「维护者」里，意思是**你愿意跟进它**：上游变了、
        内容过时了，@ 你能叫得应。它不是荣誉称号，也不要求你写多少字。
        
        机器人只做一件事：把用户名加进那个文件的 `maintainers`。它**不会**动正文，
        改完开 PR，由维护者审核后合并。
        
        **「GitHub 用户名」是必填的**——署名要用它（提交作者会写成这个名字），机器人会核实账号存在；填错直接拒绝。

        ---

        **担任维护者之后怎么改自己的词条**（不用学 Markdown，也不用本地跑脚本）：

        1. 回到词条页，右上角那排按钮就是入口：**改一个字段**（如平台、安装命令、许可证）、
           **改一句话**、**纠错**——点进去编号会自动带上；
        2. **附出处**：上游链接、规范路径、代码位置，有出处维护者才敢合；
        3. 单值与列表字段（`platforms`、`tags`、`install`…）机器人能直接改；
           **嵌套结构**（`compat`、`relations`、`providedBy`）它改不了，会明确告诉你，
           那种情况请 fork 后提 PR；
        4. 流程是**两道闸**：机器人动手前要 **`/approve`**——担任维护者之后**这一条你自己就能批**
           （不需要仓库权限）；但**合并**永远由仓库维护者点。机器人从不自己合并。

  - type: input
    id: entry
    attributes:
      label: 词条 id
      description: 形如 launcher/9、plugin/1、concept/2——哪个类型都行。从词条页点「我来维护」进来时标题里已带编号，可留空。
      placeholder: plugin/1
    validations:
      required: false
  - type: input
    id: username
    attributes:
      label: GitHub 用户名
      description: 必填——署名要用它：这条改动的提交作者会写成这个名字。只填用户名本身（不是显示名、不是邮箱、不要 @）；机器人会核实账号存在，填错直接拒绝。
      placeholder: your-github-name
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 你与这一条的关系（可选）
      description: 例如「我在用这个插件」「我是上游作者」「我在这个包上踩过坑」。写清楚会让维护者更放心。
    validations:
      required: false
