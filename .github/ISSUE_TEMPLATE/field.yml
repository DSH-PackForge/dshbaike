name: 改一个字段
description: 补或改词条头部的一个字段（分类、标签、别名、更新日期、安装命令…），机器人替你改并开 PR
title: "[改一个字段] "
body:
  - type: markdown
    attributes:
      value: |
        适合改**词条头部（front-matter）里的字段**：`updatedAt`、`summary`、`titleEn`、
        `aliases`、`tags`、`install`、`repo`、`npm`、`platforms` 这类**单值或列表**字段。

        **嵌套结构改不了**（`compat`、`relations`、`composition`、`launchers` 这种多层的）——
        那些请 [fork + PR](https://github.com/DSH-PackForge/dshbaike/blob/main/CONTRIBUTING.md)。
        机器人会明确告诉你它改不了，而不是改错。
  - type: input
    id: entry
    attributes:
      label: 词条 id
      description: 形如 `plugin/1`。
      placeholder: plugin/1
    validations:
      required: true
  - type: input
    id: field
    attributes:
      label: 字段名
      description: 只写字段名本身，小写字母（如 `updatedAt`、`tags`、`install`）。
      placeholder: updatedAt
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: 新的值
      description: |
        列表字段（`tags` / `aliases` / `platforms`…）用逗号分隔，例如 `兼容性, 前置`。
        要清空就写 `null`。
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 出处（可选但强烈建议）
      description: 你凭什么这么改？规范路径 / 代码位置 / 上游链接。
