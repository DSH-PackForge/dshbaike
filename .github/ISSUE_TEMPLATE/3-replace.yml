name: 内容变更 · 改正文里的一句话
description: 正文里有句话过时了/写错了？给「原文 → 改成」，机器人只替换那一处并开 PR
title: "[改正文里的一句话] "
labels: ["内容变更"]
body:
  - type: markdown
    attributes:
      value: |
        适合**小范围的事实修正**：一个数字过时了、一个文件名写错了、一句话表述不准。
        
        机器人只做一件很窄的事：在正文里找到你给的那段原文，**且只找到一处**，替换掉。
        找不到、或者找到多处，它会拒绝并让你自己来（不猜）。
        
        > 改动大（重写一节、加新章节、调结构）→ 直接编辑文件更合适。
        
        **「GitHub 用户名」是必填的**——署名要用它（提交作者会写成这个名字），机器人会核实账号存在；填错直接拒绝。

  - type: input
    id: entry
    attributes:
      label: 词条 id
      description: 形如 launcher/9、plugin/1、concept/2——哪个类型都行。从词条页点进来时标题里已带编号，可留空。
      placeholder: plugin/1
    validations:
      required: false
  - type: input
    id: username
    attributes:
      label: GitHub 用户名
      description: 必填——署名要用它：这条改动的提交作者会写成这个名字。只填用户名本身（不是显示名、不是邮箱、不要 @）；机器人会核实账号存在，填错直接拒绝。
      placeholder: your-github-name
    validations:
      required: true
  - type: textarea
    id: from
    attributes:
      label: 原文片段
      description: 从正文里**原样复制**一段（越长越好定位，但只包含你要改的部分）。不要贴 front-matter 里的字段。
    validations:
      required: true
  - type: textarea
    id: to
    attributes:
      label: 改成
      description: 替换后的文字。
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 出处（可选但强烈建议）
      description: 你凭什么这么改？规范路径 / 代码位置 / 上游链接——有出处我们才敢合。
    validations:
      required: false
