name: 补充分区条目（机器人代改）
description: 给某个分区加一条资源（名称 + 一句话 + 外链），机器人写进 YAML 并开 PR
title: "[补充分区条目] "
labels: ["内容变更"]
body:
  - type: markdown
    attributes:
      value: |
        分区条目很轻：**名称 + 一句话 + 至少一个外链**。机器人会把它写进对应分区的
        `items:` 里（哪一级、哪个二级分区由你指定），然后开 PR。

        **「GitHub 用户名」是必填的**——署名要用它（提交作者会写成这个名字），
        机器人会核实这个账号真的存在；填错会**直接拒绝**。

        **请自己写一句话**，不要直接抄上游 description——抄来的句子在列表里读起来都一样。
  - type: dropdown
    id: zone
    attributes:
      label: 分区
      description: 它属于哪一层；不确定就先去站上看看那一页。
      options:
        - clients
        - launchers
        - plugins
        - themes
        - assets
        - skills
        - presets
        - recipes
        - packs
        - toolchain
        - specs
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: 二级分区 id
      description: 分区页里那一节的 id（如插件分区的 `markets` / `plugins`，主题分区的 `packs` / `loaders`）。填错机器人会告诉你可用的 id。
      placeholder: markets
    validations:
      required: true
  - type: input
    id: username
    attributes:
      label: GitHub 用户名
      description: 必填——署名要用它：这条改动的提交作者会写成这个名字。只填用户名本身（不是显示名、不是邮箱、不要 @）；机器人会核实账号存在，填错直接拒绝。
      placeholder: your-github-name
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 名称
      placeholder: dsh-myskin
    validations:
      required: true
  - type: input
    id: blurb
    attributes:
      label: 一句话介绍
      description: 用你自己的话说清它解决什么问题；不要粘贴上游 README 的一整段。
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: 外部链接
      description: |
        一行一个。可用的键：`github` / `npm` / `awesome` / `dshbase` / `market` / `docs` / `spec` / `url`。
        也可以只贴一个完整 URL（会当成 `url`），或 `owner/repo`（会当成 `github`）。
      placeholder: |
        github: owner/repo
        npm: package-name
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: 补充说明（可选）
      description: 例如风险提示（会不会拿到本机权限）、与谁抢 slot、快照日期。
