name: 新增词条（申请）
description: 申请新增一条词条；编号与骨架由自动化处理，你不需要装任何东西
title: "[新增词条] "
labels: ["内容变更"]
body:
  - type: markdown
    attributes:
      value: |
        提交后机器人会**分配编号、用你填的内容建好 draft 骨架、开一个 PR**，并在本 Issue 下回帖编号。
        你不需要装 Node，也不用本地跑脚本；**合并前是草稿态，不会上线**，你可以慢慢补。
        编号是永久的：断号不回填、删除留墓碑（所以一个一直没合并的草稿会占掉那个号）。
  - type: dropdown
    id: kind
    attributes:
      label: 词条类型
      options:
        - launcher（启动器）
        - plugin（插件）
        - client（界面与客户端）
        - mcp（MCP 与工具接入）
        - skill（技能包）
        - preset（预设与人设）
        - recipe（指令与配方）
        - theme（主题与皮肤）
        - asset（素材与本地化）
        - pack（整合包）
        - tool（工具链）
        - spec（规范文件）
        - concept（概念：本体机制）
        - tutorial（教程）
        - source（资源源：外部渠道）
    validations:
      required: true
  - type: input
    id: entryTitle
    attributes:
      label: 标题
      description: 中文标题；插件词条一般就是包名或插件名。
      placeholder: 为什么 DSH 升级后插件会失效
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 一句话摘要
      description: 会用在列表卡片与搜索里，也是我们对外展示的第一句。
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: 初稿正文（可选）
      description: 有初稿就贴这里；没有也可以先建骨架，之后再补。
  - type: textarea
    id: sources
    attributes:
      label: 事实来源
      description: |
        我们只写能指到出处的事实。请列出你依据的规范文件、代码路径或上游链接；
        查不到的写「未核实」，不要猜。
    validations:
      required: true
  - type: input
    id: username
    attributes:
      label: GitHub 用户名
      description: 必填——署名要用它：这条改动的提交作者会写成这个名字。只填用户名本身（不是显示名、不是邮箱、不要 @）；机器人会核实账号存在，填错直接拒绝。
      placeholder: your-github-name
    validations:
      required: true
