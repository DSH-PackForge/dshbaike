name: 机器人代改（两道闸：Issue 里 /approve，PR 再 review）

# 两道闸（评审定调）：
#   ① **机器人动手之前**先审一遍——维护者在 **Issue 里回复 `/approve`**：
#      · 提交时先「干跑」（不写文件），把机器人打算改什么回帖出来（带**审核指纹**）；
#      · 维护者看完回复 `/approve`，机器人才开始执行；
#      · 三道保险：只有有写权限的人能批准、指纹锁定「批准时看到的那一版」、
#        同一个请求不会被执行两次。
#   ② 执行完开 PR，**merge 之前再批一次**：main 的分支保护要求 Code Owners 批准（docs/14 §4）。
#
# 覆盖的操作（scripts/lib/ops.mjs 声明，Issue 标题前缀决定用哪个）：
#   [认领维护] [改一个字段] [改正文里的一句话] [补充分区条目]
# 机器人改不了的情形（嵌套结构、定位不唯一、找不到原文）会明确拒绝并请作者 fork + PR。

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: apply-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # ---- 第一道闸（a）：提交后立刻干跑并回帖，等维护者 /approve -------------------
  # 只处理**内容变更**类的**四张单一意图表单**（前缀与 scripts/lib/ops.mjs 的操作标题一一对应，
  # 由 scripts/check-workflows.mjs 强制一致）。像「站点改进」那种关于百科本身的 Issue
  # 由人处理，机器人**不插话**——插话只会变成噪音。
  #
  # 为什么不是「一张合并表单 + 表单内选操作」：实测那样更不直观——从词条页点了「改一句话」
  # 进来的人还要在下拉里再选一次（GitHub 不让预填表单字段），而且面对的是所有操作的字段并集。
  check:
    if: >
      github.event_name == 'issues' &&
      (startsWith(github.event.issue.title, '[认领维护]') ||
       startsWith(github.event.issue.title, '[改一个字段]') ||
       startsWith(github.event.issue.title, '[改正文里的一句话]') ||
       startsWith(github.event.issue.title, '[补充分区条目]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 干跑（不写任何文件）
        id: dry
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node scripts/apply-issue.mjs --dry-run

      - name: 回帖（待审核 / 不能改 / 表单不全）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          OK: ${{ steps.dry.outputs.ok }}
          REASON: ${{ steps.dry.outputs.reason }}
          ESCALATE: ${{ steps.dry.outputs.escalate }}
          SUMMARY: ${{ steps.dry.outputs.summary }}
          FILES: ${{ steps.dry.outputs.files }}
          MESSAGE: ${{ steps.dry.outputs.message }}
          FP: ${{ steps.dry.outputs.fingerprint }}
        run: |
          set -euo pipefail
          # 这条改动动的是哪条词条、它的维护者是谁——要 @ 出来（docs/14 §1.4）
          maint=$(node scripts/who-maintains.mjs --issue --one-line 2>/dev/null || true)
          maint_mentions=""
          if [ -n "${maint:-}" ]; then
            maint_mentions=$(echo "$maint" | tr ',' '\n' | head -n 3 | sed 's/^/@/' | tr '\n' ' ')
          fi
          if [ "$OK" = "true" ]; then
            gh issue comment "$ISSUE" -R "$REPO" --body "🕓 **已收到，等维护者批准后才动手。**

          机器人打算这么改（**还没有写任何文件**）：

          > ${SUMMARY}
          > 文件：\`${FILES}\`
          ${maint_mentions:+
          > 本条词条的维护者：${maint_mentions}——你们也可以直接回复 \`/approve\` 批准（第二道合并仍由仓库维护者过）}
          维护者看完在**本 Issue 里回复 \`/approve\`** 即可执行；执行完会开 PR，
          那个 PR 还要再审一次才能合并。

          审核指纹：\`${FP}\`（只看这一版；正文在这之后被改过的话，机器人会拒绝执行并要求重新批准）"
          elif [ "$REASON" = "human-task" ]; then
            gh issue comment "$ISSUE" -R "$REPO" --body "🙋 **这类请求由人工处理**——表单没问题，你不需要再改什么。

          > \${MESSAGE}

          维护者会接手（一般几天内）。如果你愿意自己动手更快，也可以直接改文件提 PR：

          1. 打开 https://github.com/\${REPO}/edit/main/data/ 找到对应目录（新增词条就先照抄一条同类词条，比如 `data/launcher/9.md`）；
          2. 改完在提交对话框里选 **Create a new branch … and start a pull request**；
          3. 在 PR 里说清写的是什么、凭什么这么写（**出处**：上游链接 / 规范路径 / 代码位置）。

          编号是永久的：断号不回填、删除留墓碑；内容纪律见 [CONTRIBUTING.md](https://github.com/\${REPO}/blob/main/CONTRIBUTING.md)。"
          elif [ "$ESCALATE" = "true" ]; then
            gh issue comment "$ISSUE" -R "$REPO" --body "🙅 这个改动机器人**不能安全地做**：

          > ${MESSAGE}

          **请自己来**（这样最稳，也就几步）：

          1. 打开 https://github.com/${REPO}/edit/main/data/ 找到对应的文件（或直接点词条页的「编辑此条」）；
          2. 改完在提交对话框里选 **Create a new branch … and start a pull request**；
          3. 在 PR 里说清改了什么、凭什么改。

          详细流程与内容纪律见 [CONTRIBUTING.md](https://github.com/${REPO}/blob/main/CONTRIBUTING.md)。"
          else
            gh issue comment "$ISSUE" -R "$REPO" --body "😕 这个请求还不能自动处理：

          > ${MESSAGE}

          改一下本 Issue 里的表单内容就会自动重试（不必新开一个 Issue）。"
          fi

  # ---- 第一道闸（b）：维护者回复 /approve 之后才放行 ---------------------------
  gate:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/approve') &&
      (startsWith(github.event.issue.title, '[认领维护]') ||
       startsWith(github.event.issue.title, '[改一个字段]') ||
       startsWith(github.event.issue.title, '[改正文里的一句话]') ||
       startsWith(github.event.issue.title, '[补充分区条目]'))
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      fingerprint: ${{ steps.gate.outputs.fingerprint }}
      actor: ${{ steps.gate.outputs.actor }}
      role: ${{ steps.gate.outputs.role }}
    steps:
      # 这个 job 也要 checkout：`gh` 的多数子命令（issue comment 等）要能确定「当前仓库」，
      # 在没有 git 仓库的目录里跑会失败于 `fatal: not a git repository`。
      # 同时每个 gh 调用都显式带 -R "$REPO"——不依赖 git 状态才不会静默失效。
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 校验批准人权限 + 取出被审那一版的指纹
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_AT: ${{ github.event.comment.created_at }}
        run: |
          set -euo pipefail
          echo "allowed=false" >> "$GITHUB_OUTPUT"

          if [ "$COMMENT_USER" = "github-actions[bot]" ]; then
            echo "机器人的评论不算批准"; exit 0
          fi

          # 两道都认，但**都不需要给对方仓库权限**（docs/14 §1.4）：
          #   ① 仓库维护者/有写权限的人；
          #   ② **这条词条的维护者**——范围天然收窄：他只能批准自己那条词条的改动。
          # 第二道闸（merge）仍在仓库维护者手里：分支保护要求 Code Owners 批准。
          perm=$(gh api "repos/${REPO}/collaborators/${COMMENT_USER}/permission" --jq '.permission' 2>/dev/null || echo none)
          maint=$(node scripts/who-maintains.mjs --issue --one-line 2>/dev/null || true)
          echo "批准人 ${COMMENT_USER}：仓库权限=${perm}；本条词条维护者=${maint:-（无）}"

          role=""
          case "$perm" in
            admin|write) role="repo" ;;
          esac
          if [ -z "$role" ] && [ -n "${maint:-}" ]; then
            case ",${maint}," in
              *",${COMMENT_USER},"*) role="entry" ;;
            esac
          fi

          if [ -z "$role" ]; then
            gh issue comment "$ISSUE" -R "$REPO" --body "ℹ️ \`/approve\` 需要是**这条词条的维护者**，或者对本仓库有**写权限**的人（@${COMMENT_USER} 两者都不是）。

          本条词条的维护者：${maint:+$(echo "$maint" | sed 's/,/ /g' | sed 's/\([^ ]*\)/@\1/g')}${maint:-（还没有人认领）}"
            exit 0
          fi

          # 保险二：取「批准这条评论**之前**」机器人回帖里的审核指纹——
          # 也就是维护者当时看到的那一版；正文若在那之后被改过，apply 阶段会拒绝执行。
          fp=$(gh api "repos/${REPO}/issues/${ISSUE}/comments?per_page=100" \
                --jq ".[] | select(.created_at < \"${COMMENT_AT}\") | .body" \
              | grep -oE '审核指纹：`[0-9a-f]{12}`' | tail -n 1 | grep -oE '[0-9a-f]{12}' || true)
          if [ -z "${fp:-}" ]; then
            gh issue comment "$ISSUE" -R "$REPO" --body "😕 找不到这次请求的审核指纹——说明这个 Issue 提交时**干跑那一步没有成功跑过**（可能当时 workflow 文件有问题）。请让作者改一下表单内容触发重跑，或新开一张表单。"
            exit 0
          fi

          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          echo "actor=$COMMENT_USER" >> "$GITHUB_OUTPUT"
          echo "role=$role" >> "$GITHUB_OUTPUT"
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "已放行：指纹 $fp（批准人角色：$role）"

  # ---- 执行：批准之后才真的写文件、跑校验、开 PR -------------------------------
  apply:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 真正改文件（指纹不符则拒绝）
        id: apply
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          EXPECT_FINGERPRINT: ${{ needs.gate.outputs.fingerprint }}
        run: node scripts/apply-issue.mjs

      - name: 指纹不符 / 操作失败时的回帖
        if: steps.apply.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          MESSAGE: ${{ steps.apply.outputs.message }}
          REASON: ${{ steps.apply.outputs.reason }}
        run: |
          set -euo pipefail
          if [ "$REASON" = "stale-approval" ]; then
            gh issue comment "$ISSUE" -R "$REPO" --body "⚠️ 没有执行：

          > ${MESSAGE}"
          else
            gh issue comment "$ISSUE" -R "$REPO" --body "😕 执行失败（\`${REASON}\`）：

          > ${MESSAGE}"
          fi
          # 有意**不**让这一步失败：拒绝是一个正确的结果（机器人按规矩挡住了），
          # 不是一次故障。标成 failure 只会给维护者发无意义的失败通知。

      - name: 校验（机器人改的东西不能把站点弄坏）
        if: steps.apply.outputs.ok == 'true'
        run: node scripts/validate.mjs

      - name: 开 PR（署名贡献者；已执行过就跳过；建不了 PR 时退回链接）
        if: steps.apply.outputs.ok == 'true'
        id: pr
        env:
          # 优先用 BOT_TOKEN（若仓库配了这个 secret）：组织策略禁止 Actions 创建 PR 时，
          # 用一个人/机器账号的令牌就能绕过这条限制。没配就退回 GITHUB_TOKEN（受策略限制）。
          GH_TOKEN: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          OP: ${{ steps.apply.outputs.op }}
          SUMMARY: ${{ steps.apply.outputs.summary }}
          FILES: ${{ steps.apply.outputs.files }}
          AUTHOR: ${{ steps.apply.outputs.author }}
          CREDITED: ${{ steps.apply.outputs.credited }}
          NOTIFY: ${{ steps.apply.outputs.notify }}
          APPROVER: ${{ needs.gate.outputs.actor }}
          APPROVER_ROLE: ${{ needs.gate.outputs.role }}
        run: |
          set -euo pipefail
          branch="bot/${OP}-${ISSUE}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          # 保险三：同一个请求不重复执行。三条要点：
          #   · 判据是**内容**而不是「有没有 PR」——组织策略挡住建 PR 时只有分支没有 PR；
          #   · 只比**这个请求动到的文件**（$FILES），不比整棵树——否则 main 上别处的
          #     正常前进（文档、workflow）都会被当成「内容变了」，判断就永远不生效；
          #   · 用 FETCH_HEAD：`git fetch origin <branch>` 只写 FETCH_HEAD，
          #     不会创建 origin/<branch> 引用。
          IFS=',' read -ra touched <<< "$FILES"
          if git fetch --quiet origin "$branch" && git diff --quiet FETCH_HEAD -- "${touched[@]}"; then
            existing=$(gh pr list -R "$REPO" --head "$branch" --state all --json url --jq '.[0].url // empty' 2>/dev/null || true)
            echo "与 $branch 上已执行的内容一致（${FILES}），不重复执行"
            echo "mode=duplicate" >> "$GITHUB_OUTPUT"
            echo "url=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---- 署名（归因要准）：**提改动的人是提交作者，机器人只是 Co-author** ----
          # 表单里的「GitHub 用户名」是必填且已核实存在的（apply-issue.mjs 查过 API）——
          # 署名就写它，不再退回「提 Issue 的人」：谁做的改动，作者就是谁。
          # 提 Issue 的人与它不是同一个时，作为共同作者一并列出（他确实提交了这次请求）。
          credits=()
          for u in "$CREDITED" "$AUTHOR"; do
            [ -z "$u" ] && continue
            [ "$u" = "github-actions[bot]" ] && continue
            case " ${credits[*]-} " in *" $u "*) continue ;; esac
            credits+=("$u")
          done

          # noreply 邮箱才是账号认得的身份：现代格式是 <id>+<username>@users.noreply.github.com
          noreply() {
            local u="$1" id name
            id=$(gh api "users/${u}" --jq '.id' 2>/dev/null || echo "")
            name=$(gh api "users/${u}" --jq '.name // .login' 2>/dev/null || echo "$u")
            # 用显式 if：`[ ... ] || [ ... ] && name=...` 在条件为假时整条返回非零，
            # 配合 set -e 会把整个步骤干掉。
            if [ -z "$name" ] || [ "$name" = "null" ]; then name="$u"; fi
            if [ -n "$id" ]; then printf '%s <%s+%s@users.noreply.github.com>' "$name" "$id" "$u"
            else printf '%s <%s@users.noreply.github.com>' "$name" "$u"; fi
          }

          author_id="${credits[0]:-}"
          trailers=""
          credit_line=""
          # 机器人自己的身份：github-actions[bot] 的真实 noreply 邮箱
          bot_id=$(gh api "users/github-actions%5Bbot%5D" --jq '.id' 2>/dev/null || echo "41898282")
          trailers="Co-authored-by: github-actions[bot] <${bot_id}+github-actions[bot]@users.noreply.github.com>"$'\n'
          if [ -n "$author_id" ]; then
            credit_line="@${author_id}"
            for u in "${credits[@]:1}"; do
              credit_line="${credit_line}、@${u}"
              trailers="${trailers}Co-authored-by: $(noreply "$u")"$'\n'
            done
          fi
          echo "作者：${author_id:-（未知，退回机器人）}；共同作者：github-actions[bot]"

          git config user.name "dshbaike-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "没有实际改动"; echo "mode=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf 'chore(%s): %s（来自 Issue #%s）\n\n%s' "$OP" "$SUMMARY" "$ISSUE" "$trailers" > /tmp/msg.txt
          if [ -n "$author_id" ]; then
            # --author 只改「作者」，committer 仍是机器人——这正是我们要的归因
            git commit -F /tmp/msg.txt --author="$(noreply "$author_id")"
          else
            git commit -F /tmp/msg.txt
          fi
          git push --force-with-lease -u origin "$branch"
          # 第一道闸是谁批的：仓库维护者还是**本条词条的维护者**（docs/14 §1.4）
          if [ "${APPROVER_ROLE:-}" = "entry" ]; then
            role_label="本条词条维护者"
          else
            role_label="仓库维护者"
          fi
          notify_line=""
          if [ -n "${NOTIFY:-}" ]; then
            notify_line=$(echo "$NOTIFY" | tr ',' '\n' | head -n 3 | sed 's/^/@/' | tr '\n' ' ')
          fi
          body=$(printf '%s\n' \
            "由 Issue #${ISSUE} 的**表单**触发的自动改动。" \
            "" \
            "- 提出者（**提交作者**）：${credit_line:-（未知）}" \
            "- 代笔（共同作者）：github-actions[bot]" \
            "- 第一道闸批准人：@${APPROVER}（**${role_label}**）" \
            ${notify_line:+- 本条词条维护者：${notify_line}（也请过目）} \
            "- 操作：\`${OP}\`" \
            "- 改了：${SUMMARY}" \
            "- 文件：\`${FILES}\`（**只动这些**）" \
            "" \
            "第一道闸（\`/approve\`）已过；**这是第二道闸：请再审一遍具体改了什么**，然后再合并。" \
            "校验器（validate.mjs）已通过。机器人不会自己合并。")
          if url=$(gh pr create -R "$REPO" --base main --head "$branch" \
              --title "chore(${OP}): ${SUMMARY}（#${ISSUE}）" \
              --label "bot-pr,needs-review" \
              --body "$body" 2>pr-error.txt); then
            echo "mode=auto" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "mode=manual" >> "$GITHUB_OUTPUT"
            echo "原因：$(tail -n 1 pr-error.txt)"
          fi

      - name: 回帖（PR 链接）
        if: always() && steps.apply.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          MODE: ${{ steps.pr.outputs.mode }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "auto" ]; then
            gh issue comment "$ISSUE" -R "$REPO" --body "✅ 已开好 PR：${PR_URL}

          **还有第二道闸**：维护者审一遍 PR 并批准后才会合并（main 的分支保护要求 Code Owners 批准）。"
            gh issue close "$ISSUE" --reason completed || true
          elif [ "$MODE" = "duplicate" ]; then
            if [ -n "${PR_URL:-}" ]; then
              gh issue comment "$ISSUE" -R "$REPO" --body "ℹ️ 这个请求已经执行过了：${PR_URL}"
            else
              gh issue comment "$ISSUE" -R "$REPO" --body "ℹ️ 这个请求已经执行过了，内容与分支 \`${BRANCH}\` 完全一致，没有重复推送。

          开 PR：https://github.com/${REPO}/pull/new/${BRANCH}"
            fi
          elif [ "$MODE" = "manual" ]; then
            gh issue comment "$ISSUE" -R "$REPO" --body "✅ 改动已经做好并推到分支 \`${BRANCH}\`，**只差最后一下**：

          👉 点这里开 PR：https://github.com/${REPO}/pull/new/${BRANCH}

          （本组织的策略不允许 Actions 创建 PR，所以这一步留给人点。开好后仍需审 PR 再合并。）"
          else
            gh issue comment "$ISSUE" -R "$REPO" --body "ℹ️ 没有产生实际改动（可能已经是这个值了）。"
            gh issue close "$ISSUE" --reason completed || true
          fi
