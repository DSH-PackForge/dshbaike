name: 认领维护

# 「我来维护这一条」Issue 表单 → 自动把用户名加进该词条的 maintainers → 开 PR。
#
# 为什么值得自动化：认领是一件**不需要写内容**的事（只加一个用户名）。
# 让贡献者去 GitHub 网页编辑器里手改 YAML，等于把「想帮忙」的人挡在门外；
# 而让维护者手工转抄，就是把人累死。所以：表单 → 机器改文件 → 开 PR → 人只点合并。
#
# 标签解析在 scripts/claim-from-issue.mjs 里，改 Issue 模板的字段标签时必须同步改它。

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: claim-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claim:
    # 只处理认领表单（标题前缀由模板固定），别的 Issue 不碰
    if: startsWith(github.event.issue.title, '[认领维护]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 解析表单并改文件
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/claim-from-issue.mjs

      - name: 校验（认领不能让词条校验挂掉）
        if: steps.parse.outputs.ok == 'true'
        run: node scripts/validate.mjs

      - name: 开 PR
        if: steps.parse.outputs.ok == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          ENTRY: ${{ steps.parse.outputs.id }}
          USER: ${{ steps.parse.outputs.user }}
          PATH_: ${{ steps.parse.outputs.path }}
        run: |
          set -euo pipefail
          branch="claim/${ENTRY//\//-}-${USER}"
          git config user.name "dshbaike-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "没有实际改动"; echo "url=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -m "chore(maintainers): ${ENTRY} 认领维护（${USER}）"
          git push --force-with-lease -u origin "$branch"
          body=$(printf '%s\n' \
            "由 Issue #${ISSUE} 触发的自动 PR。" \
            "" \
            "- 词条：\`${ENTRY}\`" \
            "- 认领人：@${USER}" \
            "- 改动：把 \`${USER}\` 加进 \`${PATH_}\` 的 front-matter \`maintainers\`（**只动这一处**，正文未改）" \
            "" \
            "校验器已通过。合并后这一条的「没有维护者」提示会消失。")
          url=$(gh pr create --base main --head "$branch" \
            --title "chore(maintainers): ${ENTRY} 认领维护（${USER}）" \
            --body "$body")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: 回帖
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          OK: ${{ steps.parse.outputs.ok }}
          REASON: ${{ steps.parse.outputs.reason }}
          USER: ${{ steps.parse.outputs.user }}
          ENTRY: ${{ steps.parse.outputs.id }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          if [ "$OK" = "true" ] && [ -n "${PR_URL:-}" ]; then
            gh issue comment "$ISSUE" --body "✅ 已开好 PR：${PR_URL}
          合并后 @${USER} 就会出现在 \`${ENTRY}\` 的维护者里。"
            gh issue close "$ISSUE" --reason completed || true
          elif [ "$REASON" = "already" ]; then
            gh issue comment "$ISSUE" --body "ℹ️ @${USER} 已经在 \`${ENTRY}\` 的维护者里了，无需改动。"
            gh issue close "$ISSUE" --reason completed || true
          else
            gh issue comment "$ISSUE" --body "😕 这次没能自动处理（原因：\`${REASON:-unknown}\`）。
          请确认「词条 id」填的是形如 \`plugin/1\` 的编号（不是标题），然后编辑本 Issue 重试。"
          fi
