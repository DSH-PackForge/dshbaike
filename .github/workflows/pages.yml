name: Deploy to GitHub Pages

# 站点是纯静态的：构建完全离线（只读 data/ 与 collected/），所以这个 workflow
# 不需要任何 secrets，也不需要外部托管账号。
#
# 部署形态：项目子路径 https://<org>.github.io/<repo>/
# 因此构建期必须传 --base=/<repo>/ —— 嵌套页（concept/1.html）靠它解析相对资源。
# 以后挂上自定义域（根路径）时，把 --base 去掉即可。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 校验词条与数据
        run: node scripts/validate.mjs

      - name: 构建（子路径 base）
        run: node scripts/build.mjs --base=/${{ github.event.repository.name }}/

      - name: 确认构建产物没被跟踪（产物只应存在于 web/，不入库）
        run: |
          if git ls-files --error-unmatch web/data >/dev/null 2>&1; then
            echo "::error::web/data 被跟踪了，产物不应该入库"
            exit 1
          fi
          echo "产物未入库 ✅"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
