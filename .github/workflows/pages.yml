name: Deploy to GitHub Pages（备用）

# 站点是纯静态的：构建完全离线（只读 data/ 与 vendor/），所以这个 workflow
# 不需要任何 secrets，也不需要外部托管账号。
#
# **发布已经改由 Cloudflare Pages 负责**（2026-10-03 起）：项目 `dshbaike` 接在
# `dshbaike.com` 上，构建命令 `node scripts/build.mjs`、产物目录 `web`。
# 这个 workflow 因此**降级为备用**：只保留手动触发（`workflow_dispatch`），
# 不再随 `main` 自动跑 —— 跑它只会把产物发布到 `https://dsh-packforge.github.io/dshbaike/`，
# 而 `dshbaike.com` 的 DNS 已指向 Cloudflare Pages，不再经过这里。
#
# 保留它的理由：万一 Cloudflare 那边出问题，把域名记录指回 GitHub 的 A / AAAA
# （`185.199.108–111.153` / `2606:50c0:8000–8003::153`）+ 手动跑一次本 workflow 即可回退。
#
# 部署形态：根路径。构建期**不要**传 `--base` —— 嵌套页（launcher/1.html）靠写入的
# `<base href="/">` 解析相对资源；传了子路径会导致全站资源 404。
# （历史上项目子路径部署时才需要 `--base=/<repo>/`。）

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 校验词条与数据
        run: node scripts/validate.mjs

      - name: 构建（根路径：自定义域部署）
        run: node scripts/build.mjs

      - name: 确认构建产物没被跟踪（产物只应存在于 web/，不入库）
        run: |
          if git ls-files --error-unmatch web/data >/dev/null 2>&1; then
            echo "::error::web/data 被跟踪了，产物不应该入库"
            exit 1
          fi
          echo "产物未入库 ✅"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
