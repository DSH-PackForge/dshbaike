<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 站点标识（scripts/logo.mjs 生成，入库）：像素风墨绿瓷砖 + 白文档 + 琥珀高亮行 -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#12796f">
<meta property="og:image" content="https://dshbaike.com/og-image.png">
<title>{{TITLE}}</title>
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta name="description" content="{{DESC}}">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="DSH百科">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<!-- 生态全景图页外壳（docs/01 §路由、docs/02 §产物 graph.json）：
     整张 SVG 在**构建期**画好写进正文——无 JS 也能看、也能点进词条，
     pedia.js 只做渐进增强（切换派生边、悬停高亮邻居）。 -->
<script>
/* 尽早应用主题与主题色，避免刷新时闪一下默认色（键名与 pedia.js 一致）。
   这段在 <head> 里同步执行，所以必须短、且不依赖任何外部文件。 */
(function(){try{var d=document.documentElement;
var t=localStorage.getItem('dsh-pedia-theme');if(t&&t!=='auto')d.setAttribute('data-theme',t);
var a=localStorage.getItem('dsh-pedia-accent');if(a)d.setAttribute('data-accent',a);}catch(e){}})();
</script>
<base href="/">
<!--{{PEDIA_BOOT}}-->
<link rel="stylesheet" href="pedia.css">
<link rel="stylesheet" href="accent.css">
</head>
<body data-page="graph">
<a class="skip-link" href="#main">跳到正文</a>

<header class="masthead" id="site-masthead"></header>
<noscript>
  <p class="notice notice--warn"><span class="notice__icon" aria-hidden="true">!</span>
  这张图是构建期画好的 SVG，不启用 JavaScript 也能看、也能点进词条；
  切换图层与高亮邻居需要 JavaScript。</p>
</noscript>

<div class="layout">
  <main id="main" tabindex="-1"><!--{{PRERENDER}}--></main>
</div>

<footer class="footer" id="site-footer"></footer>

<script src="pedia.js" defer></script>
<script src="accent.js" defer></script>
</body>
</html>
