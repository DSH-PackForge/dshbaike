# 分类树（docs/02 §4）。点分层级；每个节点都必须有 label.zh 与 desc；
# 词条的 category 只能落在叶子节点上（validate 规则 6）。
# 一级对齐概念词条的 layer 枚举与教程主题，不搬 awesome 的 24 个插件分类键（那是二级标签的活）。
version: 1
tree:
  - id: concept
    label:
      zh: 本体机制
      en: Core mechanisms
    desc: DSH 自身怎么跑起来：层栈、目录、运行时与半端的机制级解释。
    children:
      - id: concept.runtime
        label:
          zh: 运行时与启动
        desc: profile 装配、patch 层序、CLI 启动路径一类的运行时机制。
      - id: concept.plugin
        label:
          zh: 插件与 bundle
        desc: 插件以什么形态分发与挂载：bundle 声明、patch 层、双半端。
      - id: concept.agent
        label:
          zh: 智能体与预设
        desc: agent preset、权限档位、会话内 composition 一类的智能体侧机制。
      - id: concept.workspace
        label:
          zh: 工作区与会话
        desc: 工作区注册、会话存储与分支一类的本机状态机制。
      - id: concept.ecosystem
        label:
          zh: 生态与分发
        desc: 规范、市场、启动器与外部源之间的关系与契约。
  - id: plugin
    label:
      zh: 插件与兼容
      en: Plugins and compatibility
    desc: 按「这篇内容在讲插件的哪一面」组织，不是插件目录分类。
    children:
      - id: plugin.compat
        label:
          zh: 前置与兼容
        desc: 兼容层、前置加载器、版本断裂与升级后的插件可用性。
      - id: plugin.ui
        label:
          zh: 界面扩展
        desc: 改侧边栏、面板、设置页一类界面扩展的挂载与冲突。
      - id: plugin.capability
        label:
          zh: 能力接入
        desc: 工具、模型接入、外部服务桥接一类给智能体加能力的插件。
      - id: plugin.data
        label:
          zh: 数据与记忆
        desc: 会话之外的持久化、检索与记忆后端一类插件。
      - id: plugin.packaging
        label:
          zh: 打包与安装
        desc: 导出、安装、profile 切换与整合包管理一类插件。
  - id: pack
    label:
      zh: 整合包
      en: Packs
    desc: 一次装一整套的包词条，按使用者取向分类。
    children:
      - id: pack.coding
        label:
          zh: 编码向
        desc: 面向写代码场景的整合包。
      - id: pack.media
        label:
          zh: 创作与媒体
        desc: 绘图、视频剪辑、办公产出类整合包。
      - id: pack.fun
        label:
          zh: 娱乐与趣味
        desc: 桌宠、玩法、游戏化一类整合包。
      - id: pack.general
        label:
          zh: 通用增强
        desc: 不针对特定场景、整体提升 DSH 易用性的整合包。
  - id: ops
    label:
      zh: 运维与排错
      en: Operations
    desc: 装、升、修三件事的操作类内容。
    children:
      - id: ops.install
        label:
          zh: 安装
        desc: 把东西装上：命令、落点、构建授权。
      - id: ops.upgrade
        label:
          zh: 升级
        desc: 版本变化带来的失效、回滚与迁移。
      - id: ops.troubleshoot
        label:
          zh: 排错
        desc: 启动失败、插件不生效、日志与二分定位。
  - id: ecosystem
    label:
      zh: 生态与分发
      en: Ecosystem
    desc: 规范、外部源与发布渠道。
    children:
      - id: ecosystem.spec
        label:
          zh: 规范与协议
        desc: manifest、pack-structure、index、publishing 等契约文档。
      - id: ecosystem.source
        label:
          zh: 资源源
        desc: 外部资源站与渠道：收录什么、提供哪些字段、怎么投稿。
      - id: ecosystem.publish
        label:
          zh: 发布与收录
        desc: 把自己的东西发布出去并被外部源收录。
  - id: meta
    label:
      zh: 元
      en: Meta
    desc: 关于这部百科自身与参与方式的内容。
    children:
      - id: meta.contributing
        label:
          zh: 参与与维护
        desc: 领号、写词条、提 PR 与评审约定。
  # ---- M2：为「一个分区一种词条类型」补的分类根（docs/12 §4）----
  - id: interface
    label:
      zh: 界面与入口
      en: Interfaces
    desc: 你从哪、用什么界面使用 DSH。管的是「装上与起得来」。
    children:
      - id: interface.desktop
        label:
          zh: 桌面端
        desc: 原生窗口形态的客户端：托盘、快捷键、系统集成。
      - id: interface.tui
        label:
          zh: 终端界面
        desc: 在终端里画的界面（TUI），以及无界面 CLI 的交互形态。
      - id: interface.web
        label:
          zh: 浏览器界面
        desc: 浏览器里的界面（如官方 Web UI）与其托管方式。
  - id: launch
    label:
      zh: 启动与装载
      en: Launching
    desc: DSH 怎么被起来、被谁拉起来，以及启动期的兼容。
    children:
      - id: launch.wrapper
        label:
          zh: 启动包装器
        desc: 包一层再启动的做法：注入环境、钉版本、透传参数。
      - id: launch.desktop
        label:
          zh: 桌面启动器
        desc: 带图形界面的启动与管理入口。
      - id: launch.cli
        label:
          zh: 命令行入口
        desc: 直接用命令行起来或切换 profile 的方式。
  - id: appearance
    label:
      zh: 外观与素材
      en: Appearance and assets
    desc: 它看起来、读起来像不像中文用户的东西：主题、素材与本地化。
    children:
      - id: appearance.theme
        label:
          zh: 主题与配色
        desc: 换掉界面样式与配色方案的做法。
      - id: appearance.asset
        label:
          zh: 素材
        desc: 图标、字体、壁纸一类可替换的静态资源。
      - id: appearance.locale
        label:
          zh: 本地化与文案
        desc: 界面词条与语言切换，以及第三方插件的中文化。
  - id: capability
    label:
      zh: 能力与配置
      en: Capabilities and config
    desc: 不装插件也能改行为：技能、预设与人设、可粘贴的配方。
    children:
      - id: capability.skill
        label:
          zh: 技能包
        desc: 以 SKILL.md 为单位的可加载能力，以及它的发现根。
      - id: capability.preset
        label:
          zh: 预设与人设
        desc: agent preset 与角色设定：决定这个智能体是什么、怎么说话。
      - id: capability.recipe
        label:
          zh: 指令与配方
        desc: 一小段可粘贴的配置或指令模板，改一个明确的行为。
  - id: tooling
    label:
      zh: 工具与实践
      en: Tooling
    desc: 在 DSH 之外运行的那些东西：打包、安装、索引与调试。
    children:
      - id: tooling.pack
        label:
          zh: 打包与发布
        desc: 把插件或整合包打出来、发出去的工具。
      - id: tooling.install
        label:
          zh: 安装与校验
        desc: 装包、校验产物完整性的工具与流程。
      - id: tooling.index
        label:
          zh: 索引与调试
        desc: 读市场索引、排查启动与插件加载问题的工具。
