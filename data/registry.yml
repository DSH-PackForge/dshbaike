# 编号契约（docs/02 §2）：各 kind 独立计数、断号不回填、删除留墓碑、永不复用。
# 只有 scripts/new.mjs 会改 counters。顺序对齐 docs/12 §1 的「一个分区一种类型」。
version: 1

# 分区展示顺序（docs/06 §2）：**这里是顺序的唯一来源**。
# 构建期产物 web/data/zones/index.json 与站点侧栏都按它排——不再按 id 字母序
# （那正是之前「素材与本地化 → 界面与客户端 → 启动器…」看着毫无道理的原因）。
# 顺序原则（评审定的）：界面与客户端 → 插件 → 技能包 → 启动器 → 整合包 → 其余 →
# **规范与协议永远垫底**（它是查阅用的，不是入口）。
# validate 规则 26 会检查这里与 data/zones/*.yml 完全对应。
