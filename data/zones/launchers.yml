  - name: DSHA · DeepSeek Harness 安卓启动器
    section: launchers
    blurb: 唯一的移动端形态（这一区里 star 最多的之一）：一个 APK 里塞了离线 Ubuntu 24.04 rootfs，免 ROOT 免 Termux，装完填个 API key 就能跑完整的 DSH；proroot 用 LD_PRELOAD + 二进制补丁免掉 proot 的 ptrace 开销。插件安装默认禁用生命周期脚本、第三方插件先审阅后启用。仅 arm64、包体 261/334 MiB。771 star（快照 2026-10-02）。
