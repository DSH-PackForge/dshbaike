  - name: DSH Tauri Launcher
    section: launchers
    blurb: 形态特别的一个：不是单独一个启动器应用，而是「Web 插件 + Tauri 桌面应用」一对——装进 DSH 的是插件（设置 → 桌面启动），负责唤起并盯住桌面应用，连带管快捷方式、退出确认与运行状态；它不装 DSH 版本、也不导整合包。Windows 已支持，Linux / macOS 规划中。2 star、候选版 v1.1.0-rc.1（快照 2026-10-02）。
