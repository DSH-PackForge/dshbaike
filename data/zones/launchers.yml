# 分区层数据（docs/06 §2、docs/07 §6）。启动器不是「收录问题」而是「身份认领问题」：
# canonical ID 才让整合包能声明支持谁（manifest v5 §13 的 launchers 字段）。
zone: launchers
title: 启动器
desc: .dspack 的安装端，也是「怎么装上并起得来」那一步的承载者。事实源是规范仓库的 launcher-registry.md 与它的机器可读版 launchers.json，当前共 5 条已认领 ID。
kinds: [launcher]
sections:
  - id: launchers
    title: 启动器
    desc: 替你起 DSH 的那一层：包装器、图形入口与它们认领的 canonical ID
  - id: bare
    title: 无启动器起步
    desc: 不装任何启动器时的起点
howto: 认领方式：向规范仓库提 PR，在 launcher-registry.md 加一行（ID + 启动器名 + 版本自报方式 + 仓库链接）。安装端判定规则见 pack-structure/v3.md §9.1：不满足 minVersion 时提示后**放行**，绝不硬拒。注意 dshl 与 hdsl 只差一个字母、完全无关。
itemFields: [launcherId, lineage, platforms, selfVersioning, importSupport]
