zone: packs
title: 整合包
desc: 一次装一整套：.dspack 单文件包（manifest v5 的 profile / dshhome 两形态）。装法由启动器或 dspack CLI 承担，本站只做入口与成分说明。
dataSource: market
howto: 用「安装端」装：dsh-packforge-app 的 GUI / dspack CLI，或支持 .dspack 的启动器（HDSL 已采纳）。装完落在一个 profile 目录里，见「profile」与「$DSH_HOME」两条概念。dshhome 形态会覆盖整机 home 级内容，装前先看清 manifest 的 type。
