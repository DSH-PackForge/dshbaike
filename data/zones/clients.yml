  - name: 裸 dsh 命令行
    section: official
    blurb: 不依赖任何启动器，直接用 dsh 命令行：dsh --profile <name> 启动某个 profile，dsh --version 自报版本。卸载启动器之后唯一还能用的入口。
    form: cli
    shippedBy: official
    platforms: [windows, macos, linux]
    source: curated
    entry: null
    tags: ["开发与运行时"]
    links:
      github: deepseek-ai/deepseek-harness
  - name: headless 跑法
    section: official
    blurb: 无界面的单次任务形态：dsh --profile headless "跑一遍测试"，回答一次就退出；没有浏览器、没有桌面壳，适合脚本与 CI。
    form: headless
