zone: clients
title: 界面与客户端
desc: 你从哪、以什么界面使用 DSH：官方 Web UI、各类桌面端、终端界面（TUI）、无界面 CLI 与 headless 跑法。「启动器」管的是装上与起得来，这里管的是用起来是什么样。
dataSource: curated
kinds: [client]
sections:
  - id: official
    title: 官方客户端
    desc: 官方自带的形态：浏览器界面、桌面端、裸 CLI 与 headless 跑法
  - id: third-party
    title: 第三方客户端
    desc: 社区做的壳与终端界面。本轮还没有具名实现，占位条目欢迎补充
howto: 起法写在 blurb 里：官方 Web UI 是 dsh web（等价于 --profile web），无启动器直用就是裸 dsh 命令行，headless 跑法是 --profile headless。第三方形态请以各自仓库的说明为准。
itemFields: [form, shippedBy, profile, platforms]
items:
  - name: 官方 Web UI
    section: official
    blurb: 浏览器里的完整界面，用 dsh web 启动（等价于 --profile web，是 dsh 的硬编码别名）。入口图由引导脚本注入（`window.__DSH_BOOT__` 这一口径来自前一轮核实，写词条时在 @deepseek-ai/* 里检索未命中，**待复核**）。
    form: web
    shippedBy: official
    profile: web
    platforms: [browser]
    source: curated
    entry: client/1
    tags: ["UI 增强"]
    links:
      github: deepseek-ai/deepseek-harness
  - name: 官方桌面端
    section: official
    blurb: DeepSeek Harness 官方桌面端。它既是客户端形态，也在启动器注册表里以 official-desktop 认领 ID。它的界面形态与平台清单在本机可读副本里查不到，标未核实。
    form: desktop
    shippedBy: official
    source: curated
    entry: null
    links:
