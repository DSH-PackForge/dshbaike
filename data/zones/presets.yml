# 分区层数据（docs/06 §2）。配置层之一：预设与人设。curated-list。
zone: presets
title: 预设与人设
desc: 改 DSH 的行为与语气：agent preset（一个会话用哪些插件行）与 persona / 角色设定。预设决定「这个智能体是什么」，人设决定「它怎么说话」。
dataSource: curated
kinds: [preset]
sections:
  - id: builtin
    title: 内置预设
    desc: 出厂就有的那几个：从最小可用到完整形态
  - id: custom
    title: 自定义与人设
    desc: 自己写的、或随整合包分发的那条路
howto: 预设是一个目录：$DSH_HOME/.agent-presets/<id>/ 里放 agent.cordis.yml（必需的自组合清单）与可选的 preset.yml（只放显示文本）。id 即目录名，只允许小写字母、数字与连字符；先扫描到的根赢同名 id。改完不用重启：发现每次调用都重读根。
itemFields: [presetId, shippedBy]
items:
