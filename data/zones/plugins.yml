# 分区层数据（docs/06 §2、docs/07 §5）。插件分区是 external-index：
# 全量在外部源，本站只展示「有词条 + 有生态证据」的子集，并显式给出源头入口。
zone: plugins
title: 插件
desc: 给 DSH 加功能：宿主侧 / 客户端侧插件、bundle 与兼容层。这里只列「本站写了词条」和「已被收录整合包用到」的条目；生态全貌在 awesome-dsh-plugin.com（4400 条）与 dshbase.com。
dataSource: awesome
howto: 装插件用 `dsh plugin --profile <name> add <npm 包名 | github:owner/repo>`。GitHub 来源会在安装时跑构建脚本，pnpm 默认拦截，需要按提示把键名加进该 profile 的 pnpm-workspace.yaml 的 allowBuilds 后再装一次；只装可信来源，并尽量锁 commit（github:owner/repo#sha）。落点是 profile 目录，见「profile」与「$DSH_HOME」两条概念。
itemFields: [role, entryGate]
items:
  - name: dsh-loader
    blurb: 版本感知的运行时兼容层：在 DSH 升级、内部包版本变化之后，让第三方插件不必改源码就能继续挂上。升级炸插件时的第一根救命稻草。
    role: compat
    entryGate: pack
    source: curated
    entry: plugin/1
    tags: ["开发与运行时"]
    links:
      github: dsh-plugins/dsh-loader
      npm: "@dsh-plugin/dsh-loader"
  - name: dsh-pack-plugin
    blurb: 整合包管理 bundle（host + client 双半端）：.dspack 导出 / 安装、多 profile 切换、市场浏览、工作区配置与任务中心，零官方源码改动。
    role: bundle+client
    entryGate: pack
    source: curated
    entry: plugin/2
    tags: ["插件市场与管理"]
    links:
