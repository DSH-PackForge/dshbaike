# 分区层数据（docs/06 §2、docs/07 §5）。插件分区是 external-index：
# 全量在外部源，本站只展示「有词条 + 有生态证据」的子集，并显式给出源头入口。
zone: plugins
title: 插件
desc: 给 DSH 加功能：官方本体的 packages/（本体就是一堆插件）+ 第三方的宿主侧 / 客户端侧插件与 bundle。这里只列「官方来源」「本站写了词条」「已被收录整合包用到」的条目；生态全貌在 awesome-dsh-plugin.com（4400 条）与 dshbase.com。
kinds: [plugin]
sections:
  - id: markets
    title: 插件市场
    desc: 市面上的插件源与目录：它们负责「发现」与全量收录，我们负责解释
    intro: |
      插件这一层现在有四家在做**不同的事**，把它们混为一谈是新手最常见的误解：

      | 去处 | 它负责什么 | 我们引用的数字（快照 2026-10-01） |
      | --- | --- | --- |
      | [awesome-dsh-plugin.com](https://awesome-dsh-plugin.com/zh/) | 社区精选目录：中英双语、按分类浏览，机器可读入口是 `catalog.json` | 收录 **4400** 条（首页自述 24 个分类；我们实测 `cat` 去重是 **23**，口径不一致已注明） |
      | [dshbase.com](https://dshbase.com/) | 中文指南与排错：入门与常见故障 | 收录 **7797** 条插件条目 |
      | [dsh-pack-market](https://github.com/DSH-PackForge/dsh-pack-market) | 整合包索引与启动器认领（不是插件目录） | **8** 个包 · **4** 个插件 · **5** 条启动器认领 |
      | [规范仓库](https://github.com/DSH-PackForge/DSH-PackForge) | 契约的定义者：`manifest`、`pack-structure`、`index`、`publishing` | manifest **v1–v5** · pack-structure **v1–v3** |

      **本站刻意不做插件全量收录。** 全量目录交给上面两家——它们做得比我们好，而且一直在更新。
      我们收的是**被教程引用过、或被整合包用到**的插件，为它写一篇聚合页：定位、关系、兼容、
      以及踩过的坑（这些是目录里查不到的）。所以这里的条目数会一直远小于生态总量，
      这是设计目标，不是进度落后。
  - id: plugins
    title: 插件
    desc: 本站收录的插件聚合页：官方本体 + 被教程引用过、或被整合包用到的第三方插件
howto: 装插件用 `dsh plugin --profile <name> add <npm 包名 | github:owner/repo>`。GitHub 来源会在安装时跑构建脚本，pnpm 默认拦截，需要按提示把键名加进该 profile 的 pnpm-workspace.yaml 的 allowBuilds 后再装一次；只装可信来源，并尽量锁 commit（github:owner/repo#sha）。落点是 profile 目录，见「profile」与「$DSH_HOME」两条概念。
itemFields: [role, entryGate]
