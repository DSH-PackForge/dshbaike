  - name: dsh-simple-drawing
    blurb: 四条作画路线：参考图提取成「多边形骨架 + 内孔 + 调色板」再重画、MakeHuman 网格做七头身立绘、轴对齐方块拼角色、平涂图转像素画。依赖 numpy / pillow / opencv-python-headless。
