# 分区层数据（docs/06 §2）。配置层之一：技能包。curated-list——可从整合包归档反查。
zone: skills
title: 技能包
desc: 以 SKILL.md 为单位的可加载能力，通常随包分发或由本机安装态决定。这里收的是「有公开来源、能被别人装上」的技能与技能合集。
dataSource: curated
howto: 技能落在四个地方：项目内 .dsh/skills 或 .agents/skills、用户级 $DSH_HOME/skills 或 ~/.agents/skills（按 rank 小者优先）；装整包时通常由包的安装流程写进 $DSH_HOME/skills。写完放对目录即被模型看见，不需要构建。放错目录是「技能存在但不生效」的第一大原因。
itemFields: []
items:
  - name: cad-ppt-skills（autocad-draw + pptx-editor）
    blurb: 两个 Windows 原生技能：autocad-draw 用 COM 驱动本机 AutoCAD 出图 / 改图 / 导出校验；pptx-editor 生成 / 编辑 / 预览 PPT，内置 7 套主题 × 11 种版式的宣传风排版引擎。首次使用要跑各自的 install.ps1 建 .venv。
    source: curated
    entry: null
