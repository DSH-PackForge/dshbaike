      market: https://dsh-packforge.github.io/dsh-pack-market/#/pack/LQH-A-A-O.cad-ppt-skills
  - name: dsh-bcut-edit
    blurb: 用代码做视频剪辑：直接读写必剪（Bcut）的 .bjson 草稿工程（多轨道 / 转场 / 字幕 / 配乐），或用 ffmpeg 渲染成品 mp4——同一份剪辑方案喂两个后端。需本机已装必剪 3.10.x。
    source: curated
