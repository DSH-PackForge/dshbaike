  - name: publish-to-github
    blurb: 把 DSH 整合包发布到 GitHub 供 dsh-pack-market 自动收录的一套技能：建 public 仓库、打 dsh-pack 话题、发正式 Release（.dspack 加 .sha256 侧车）、逐项校验。它与本机安装的技能目录同名，具体来源与收录状态未核实。
