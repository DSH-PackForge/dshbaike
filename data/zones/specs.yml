  - name: workspace-config/v1.md（.dshpkcfg）
    section: current
    blurb: 导出工作区本地快照的契约：单个 UTF-8 JSON 对象、2 空格缩进 + 结尾换行、只认白名单字段，空字符串表示未填写。它对应实现里的 .dshpkcfg 文件。
