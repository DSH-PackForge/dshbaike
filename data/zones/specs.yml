# 分区层数据（docs/06 §2）。元层之一：规范与协议。external-index——条目就是规范仓库里的文件。
# 一切字段争议的最终裁判在这里，概念词条的 spec 也多指向它。
#
# 结构说明（评审 2026-10-02 两轮）：
#   ① 这六份规范**同属一个仓库**（DSH-PackForge/DSH-PackForge 的 specs/），原先拆成 8 条条目过度了；
#   ② 收敛后又出现「两个条目指向同一条词条」的情况——条目数读起来是虚的。
# 现在：**一节一条**，条目数 = 真正的内容单位。
#   · spec/1 = 占位编号位（draft，先不放内容）
#   · spec/2 = 规范仓库总览（六份现行规范 + 历史版本都在这一条里）
zone: specs
title: 规范与协议
desc: DSH 全生态的规范与协议——这里的「规范」是**广义**的：凡是生态里"大家照着做"的约定都算。有**官方**定义的形态与协议（profile、插件 bundle、技能包、preset、半端划分）；有**社区**共同维护的互操作协议（如 dsh-ecosystem-spec 收录的插件元协议 dsh-std 与运行环境元协议 dsh-distribution）；有**实现方/生态方**的约定（整合包清单 manifest、.dspack 容器 pack-structure、市场索引 index、发布流程 publishing、启动器注册表）；也有**跨应用协议**（MCP）与工程规范。谁说了算分层次：官方的不由社区改，社区的只约束自愿采纳者，实现方的只管自己那一族——有争议时以**对应出处**的文件为准，而不是以某个实现或某个包的现状为准。
kinds: [spec]
sections:
  - id: current
    title: 现行规范
    desc: 现在照它做就对的那几份。目前收的是"文件型规范"：整合包这一族（manifest / pack-structure / index / publishing / launcher-registry / workspace-config）与社区互操作规范；DSH 本体那一侧的契约按概念词条写在各自分区里。
  - id: history
    title: 历史版本
    desc: 旧版本仍然可读：读它是为了理解字段怎么长出来的
    collapsed: true
howto: 按问题找出处：问「一个包能声明什么」看 manifest；问「.dspack 怎么装、文件落到哪」看 pack-structure；问「怎么才会被市场收录」看 publishing；问「启动器 canonical ID 与版本怎么判」看 launcher-registry；问「profile / patch 层 / DSH_HOME 是什么」看 DSH 本体那一侧（本站按概念词条写）；问「插件之间怎么互相告知版本与兼容需求」看社区的 dsh-std；问「一台机器上多个整合包怎么共存」看 dsh-distribution。要改规范就向**对应的仓库**提 PR，别在实现里私自分叉。
itemFields: [specVersion, specStatus, fileName]
