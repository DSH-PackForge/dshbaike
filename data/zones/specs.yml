  - name: index/index.md（市场索引 schemaVersion 2）
    section: current
    blurb: 市场索引契约：index.json 只放 downloadUrl / sha256 / size 指针与元数据，完整 manifest 与 README 按 packs/<owner>.<repo>/ 懒加载。它是本站整合包分区的上游。
