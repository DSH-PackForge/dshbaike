# 分区层数据（docs/06 §2）。元层之一：规范与协议。external-index——条目就是规范仓库里的文件。
# 一切字段争议的最终裁判在这里，概念词条的 spec 也多指向它。
#
# 结构说明（评审 2026-10-02）：这六份规范**同属一个仓库**（DSH-PackForge/DSH-PackForge 的 specs/），
# 原先拆成 8 条条目过度了。现在只留两条词条：
#   · spec/2 = 规范仓库总览（manifest / pack-structure / index / publishing / launcher-registry / workspace-config）
#   · spec/1 = manifest v5（保留：它是最常被引用的那一份，值得独立成条）
# 历史版本不再单列条目，收进 collapsed 小节，需要的人展开看。
zone: specs
title: 规范与协议
desc: manifest、pack-structure、index、publishing、launcher-registry 等契约文档——它们都写在同一个仓库里。谁说了算的问题在这一层结束：有争议时以规范仓库的文件为准，而不是以某个实现或某个包的现状为准。
kinds: [spec]
sections:
  - id: current
    title: 现行规范
    desc: 现在照它做就对的那几份
  - id: history
    title: 历史版本
    desc: 旧版本仍然可读：读它是为了理解字段怎么长出来的
    collapsed: true
howto: 读的顺序建议按版本读：manifest 从 v1 到 v5 看字段是怎么长出来的；pack-structure v3 是当前 .dspack 容器契约；index/index.md 是市场索引 schemaVersion 2；launcher-registry.md 与发布流程各一份。要改规范就向该仓库提 PR，别在实现里私自分叉。
itemFields: [specVersion, specStatus, fileName]
items:
  - name: DSH-PackForge 规范仓库（总览）
    section: current
    blurb: 六份规范都在这里：manifest 决定包里声明什么、pack-structure 决定 .dspack 怎么装、index 决定市场怎么索引、publishing 决定怎么被收录，另有启动器 canonical ID 表与 .dshpkcfg 格式。一条词条看懂它们的分工与互相引用。
    specVersion: null
