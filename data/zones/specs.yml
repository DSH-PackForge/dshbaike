# 分区层数据（docs/06 §2）。元层之一：规范与协议。external-index——条目就是规范仓库里的文件。
# 一切字段争议的最终裁判在这里，概念词条的 spec 也多指向它。
#
# 结构说明（评审 2026-10-02 两轮）：
#   ① 这六份规范**同属一个仓库**（DSH-PackForge/DSH-PackForge 的 specs/），原先拆成 8 条条目过度了；
#   ② 收敛后又出现「两个条目指向同一条词条」的情况——条目数读起来是虚的。
# 现在：**一节一条**，条目数 = 真正的内容单位。
#   · spec/1 = 占位编号位（draft，先不放内容）
#   · spec/2 = 规范仓库总览（六份现行规范 + 历史版本都在这一条里）
zone: specs
title: 规范与协议
desc: DSH 全生态的规范与协议：谁说了算的问题在这一层结束。既有 **DSH 本体定义的形态与协议**（profile、插件 bundle、技能包、preset、半端划分——权威是官方仓库），也有**生态各方共同维护的约定**（整合包清单 manifest、.dspack 容器 pack-structure、市场索引 index、发布流程 publishing、启动器注册表 launcher-registry）。有争议时以对应的规范/协议文档为准，而不是以某个实现或某个包的现状为准。
kinds: [spec]
sections:
  - id: current
    title: 现行规范
    desc: 现在照它做就对的那几份。目前这里收的是整合包这一族（manifest / pack-structure / index / publishing / launcher-registry / workspace-config）；DSH 本体那一侧的契约按概念词条写在各自分区里。
  - id: history
    title: 历史版本
    desc: 旧版本仍然可读：读它是为了理解字段怎么长出来的
    collapsed: true
howto: 按问题找权威：问「一个包能声明什么」看 manifest；问「.dspack 怎么装、文件落到哪」看 pack-structure；问「怎么才会被市场收录」看 publishing；问「启动器 canonical ID 与版本怎么判」看 launcher-registry；问「profile 是什么、patch 层怎么叠、DSH_HOME 指哪」看 DSH 本体那一侧——本站把这部分按概念词条写（见各分区的概念条目），不另立规范条目。要改规范就向对应的仓库提 PR，别在实现里私自分叉。
itemFields: [specVersion, specStatus, fileName]
items:
  - name: DSH-PackForge 规范仓库
    section: current
    blurb: 现行六份规范都在这一个仓库里：manifest v5（包里声明什么）、pack-structure v3（.dspack 怎么装）、index（市场索引 schemaVersion 2）、publishing v1（怎么被收录）、launcher-registry（启动器 canonical ID 表）、workspace-config v1（.dshpkcfg 格式）。一条词条讲清它们的分工与互相引用。
    specVersion: null
