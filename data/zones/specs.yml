  - name: launcher-registry.md（启动器认领表）
    section: current
    blurb: 5 条 canonical ID 的认领表，以及版本比较规则：逐段数值比较、缺段视为 0、不做预发布语义；不满足 minVersion 只提示不硬拒。机器可读版是 launchers.json。
