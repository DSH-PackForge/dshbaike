# 分区层数据（docs/06 §2）。元层之一：规范与协议。external-index——条目就是规范仓库里的文件。
# 一切字段争议的最终裁判在这里，概念词条的 spec 也多指向它。
zone: specs
title: 规范与协议
desc: manifest、pack-structure、index、publishing、launcher-registry 等契约文档。谁说了算的问题在这一层结束：有争议时以规范仓库的文件为准，而不是以某个实现或某个包的现状为准。
kinds: [spec]
sections:
  - id: current
    title: 现行规范
    desc: 现在照它做就对的那几份
  - id: history
    title: 历史版本
    desc: 旧版本仍然可读：读它是为了理解字段怎么长出来的
howto: 读的顺序建议按版本读：manifest 从 v1 到 v5 看字段是怎么长出来的；pack-structure v3 是当前 .dspack 容器契约；index/index.md 是市场索引 schemaVersion 2；launcher-registry.md 与发布流程各一份。要改规范就向该仓库提 PR，别在实现里私自分叉。
itemFields: [specVersion, specStatus, fileName]
items:
  - name: manifest v5（当前）
    section: current
    blurb: 现行清单契约：type 分 profile / dshhome，bundles 与 dependencies 钉死坐标版本，patch 是包自带的一层；r2 追加 vendored、dshVersions、launchers 三组可选字段。
    specVersion: 5
    specStatus: current
    fileName: specs/manifest/v5.md
    source: specs
    entry: spec/1
    tags: ["工具与能力"]
    links:
      spec: https://github.com/DSH-PackForge/DSH-PackForge/blob/main/specs/manifest/v5.md
  - name: manifest v1–v4（历史版本）
    section: history
    blurb: 四个历史版本，保留用来读旧包：市场里实测仍有包声明 manifestVersion 4（更好的侧边栏）。读旧包时按它声明的版本去读对应文件，别拿 v5 的规则去判它。
    specVersion: 1
    specStatus: historical
    fileName: specs/manifest/v1.md
    source: specs
    entry: null
    links:
      spec: https://github.com/DSH-PackForge/DSH-PackForge/blob/main/specs/manifest/v1.md
  - name: pack-structure v3（当前）
    section: current
    blurb: .dspack 容器契约：标准 ZIP，根放 dspack.json 标记与 manifest.json；profile 形态把机器文件放根、其余放 overrides/、home 级内容放 home/。含安装端判定规则与安全规则。
    specVersion: 3
    specStatus: current
    fileName: specs/pack-structure/v3.md
    source: specs
    entry: null
    tags: ["工具与能力"]
    links:
      spec: https://github.com/DSH-PackForge/DSH-PackForge/blob/main/specs/pack-structure/v3.md
  - name: pack-structure v1–v2（历史版本）
    section: history
    blurb: 容器契约的历史版本，用于读旧包与追踪字段演进。
    specVersion: 1
    specStatus: historical
    fileName: specs/pack-structure/v1.md
